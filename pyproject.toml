[project]
name = "xiv-healwork-solver"
version = "0.1.0"
description = "Skill-agnostic FF14 mitigation and healing timeline optimizer backed by FFLogs, OR-Tools CP-SAT, and Monte Carlo robustness simulation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ortools>=9.11",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "rich>=13.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
ml = [
    "torch>=2.4",
]

[project.scripts]
xiv-healwork = "xiv_healwork_solver.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiv_healwork_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
