# Synthetic 3-minute Savage-style encounter timeline for demo & RL training
encounter_name: "Example Savage Encounter (3min Demo)"
zone_name: "Demo Tier"
duration_s: 185.0

movement_windows:
  - start_s: 45.0
    end_s: 58.0
    name: "移動ギミック1（詠唱困難区間）"
    cast_interrupt_prob: 0.90
  - start_s: 126.0
    end_s: 138.0
    name: "2分バースト＋散開移動"
    cast_interrupt_prob: 0.85

downtime_windows: []

auto_attacks:
  - start_s: 3.0
    end_s: 45.0
    target: mt
    damage_type: physical
    raw_damage_per_hit: 22000
    interval_s: 3.0
  - start_s: 58.0
    end_s: 126.0
    target: mt
    damage_type: physical
    raw_damage_per_hit: 24000
    interval_s: 3.0
  - start_s: 138.0
    end_s: 185.0
    target: st
    damage_type: physical
    raw_damage_per_hit: 24000
    interval_s: 3.0

events:
  - id: e1_opener_raidwide
    time_s: 12.0
    name: "開幕全体魔法"
    damage_type: magical
    target_scope: party
    raw_damage: 118000
    requires_movement: false

  - id: e2_tankbuster
    time_s: 28.0
    name: "タンク強攻撃1"
    damage_type: physical
    target_scope: mt
    raw_damage: 215000
    requires_movement: false

  - id: e3_stack_bleed
    time_s: 52.0
    name: "移動ギミック＋全体DoT"
    damage_type: magical
    target_scope: party
    raw_damage: 128000
