    requires_movement: false

  - id: e5_tankbuster2
    time_s: 112.0
    name: "タンク強攻撃2"
    damage_type: physical
    target_scope: mt
    raw_damage: 225000
    requires_movement: false

  - id: e6_burst_raidwide
    time_s: 132.0
    name: "2分バースト中全体"
    damage_type: magical
    target_scope: party
    raw_damage: 134000
