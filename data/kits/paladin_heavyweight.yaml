# Lv.100 Paladin (ナイト) skill kit for AAC Heavyweight Savage (fully data-driven & editable)
# Demonstrates job-specific Tank resource mechanics: Oath Gauge (オウス) generated strictly by
# the player's own auto-attacks (`gain_per_player_aa: 5.0`, automatically pausing during downtime!).
label: "Paladin Lv.100 (2.50s GCD, TEN 1400, Oath AA Gauge)"
role: tank
player_is_mt: true
gcd_s: 2.50
player_aa_interval_s: 2.24
base_weave_slots_per_gcd: 2
burst_interval_s: 60.0
burst_duration_s: 15.0
burst_offset_s: 5.0
burst_weave_slots_per_gcd: 1
max_hp_party: 180000
max_hp_tank: 280000
tank_raidwide_damage_ratio: 0.62
on_attack_heal_target: mt
on_attack_heal_value: 6000          # Holy Spirit / Confiteor combo self-heal averaged per GCD (pauses in downtime!)

gear_stats:
  tenacity: 1400
  determination: 2400
  spell_or_skill_speed: 420
  heal_scale_multiplier: 1.0

resources:
  - name: oath
    initial: 0.0
    maximum: 100.0
    gain_per_player_aa: 5.0         # +5 Oath on every Paladin auto-attack while boss is targetable!

