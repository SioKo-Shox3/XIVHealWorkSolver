# Editable skill kit example (Barrier Healer archetype - fully data-driven, easy to update for 8.0+)
label: "Example Barrier Healer (2.48s GCD, PIE 800, 1 Raise Reserve)"
role: healer
gcd_s: 2.48
base_weave_slots_per_gcd: 1
burst_interval_s: 120.0
burst_duration_s: 20.0
burst_offset_s: 5.0
burst_weave_slots_per_gcd: 1
max_hp_party: 120000
max_hp_tank: 190000

gear_stats:
  piety: 800                       # Combat MP regen bonus
  determination: 2200
  spell_or_skill_speed: 600
  heal_scale_multiplier: 1.0
  filler_gcd_mp_cost: 400.0        # Baseline attack GCD MP drain (400 MP / 2.48s ~= 161 MP/s)
  lucid_dreaming_mp_per_sec: 64.2  # Lucid Dreaming used on CD (3850 MP / 60s)
  raise_mp_cost: 2400.0
  planned_raise_reserve: 1         # Keep >= 2400 MP reserved for emergency Raise

resources:
  - name: mp
    initial: 10000
    maximum: 10000
    regen_per_sec: 66.7
  - name: gauge
    initial: 3
    maximum: 3
    regen_per_sec: 0.05   # 1 stack every 20s

